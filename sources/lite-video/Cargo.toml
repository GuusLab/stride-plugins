# Standalone on purpose: builds for wasm32-unknown-unknown, joins no workspace.
[workspace]

[package]
name = "lite-video"
version = "1.0.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
extism-pdk = "1.4.1"
stride-pdk = { path = "../../pdk-rust" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
