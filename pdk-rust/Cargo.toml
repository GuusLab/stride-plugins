# Standalone on purpose: a plugin builds for wasm32-unknown-unknown, which is
# a different target and a different profile from the server workspace.
[workspace]

[package]
name = "stride-pdk"
version = "0.0.1"
edition = "2024"
license = "MIT"
description = "Write Stride plugins in Rust: the hook types, the host functions and the errors."
repository = "https://github.com/guuskaashoek/stride"

[dependencies]
extism-pdk = "1.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
